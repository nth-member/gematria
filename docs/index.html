<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>H-Gematria/ASCII</title>
<meta name="description" content="H-Gematria/ASCII: a full name, or a list of full names.">
<link rel="stylesheet" href="site.css">
<style>
h1{margin-bottom:16px}
.card h2{margin-bottom:10px}
.systems{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:640px){.systems{grid-template-columns:1fr}}
.systems .delta{grid-column:1/-1}
.pick{display:inline-block;position:relative;overflow:hidden;margin:0;padding:7px 11px;border:1px solid var(--axis);border-radius:8px;cursor:pointer;
  font-size:14px;letter-spacing:0;text-transform:none;color:var(--ink);background:var(--plane)}
.pick input{position:absolute;width:1px;height:1px;opacity:0}
.bar #chosen{margin:0;align-self:center}
textarea:disabled{opacity:.45}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.chip{background:var(--chip);border-radius:6px;padding:3px 6px;text-align:center;min-width:30px;
  font-family:ui-monospace,monospace;line-height:1.25}
.chip b{display:block;font-size:13px;font-weight:600}
.chip i{display:block;font-style:normal;font-size:10.5px;color:var(--ink-2)}
.chip.ctl b{font-size:10px}
.total{font:600 26px/1.1 ui-monospace,monospace;letter-spacing:-.02em;margin-top:6px}
</style>
</head>
<body>
<div class="wrap">
<nav class="top"><a href="./" aria-current="page">Calculator</a>
  <a href="../member/">The nth member</a><a href="../revott/">REVOTT atop GDELT</a><a href="../gdelt/">GDELT day sources</a></nav>

<h1>H-Gematria/ASCII</h1>

<section class="card">
  <h2>FULL NAME (GIVEN)</h2>
  <input id="one" type="text" autocomplete="off" spellcheck="false" style="width:100%" placeholder="Type a name">
  <p class="note mono" id="as1" hidden style="margin:8px 0 0"></p>
  <div class="systems" style="margin-top:12px">
    <div><label>H-Gematria</label><div id="g1"></div></div>
    <div><label>ASCII</label><div id="a1"></div></div>
    <div class="delta"><label>Delta</label><div id="d1"></div></div>
  </div>
</section>

<section class="card">
  <h2>RUN FULL NAMES (GIVEN) ON A LIST</h2>
  <textarea id="list" rows="9" spellcheck="false" autocomplete="off" placeholder="One name per line"></textarea>
  <div class="bar" style="margin-top:10px">
    <button id="run">Run</button>
    <button id="reset">Clear</button>
    <label class="pick"><input type="file" id="file" accept=".txt,.csv,.tsv,text/plain,text/csv">or a file…</label>
    <span class="note mono" id="chosen"></span><button id="unchoose" hidden aria-label="Remove the file">×</button>
  </div>
  <pre class="term" id="term" hidden></pre>
</section>
</div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let VALUES = {}, CONTROL = {};

// ---- the two programs, line for line ----------------------------------------

// gematria_names.gematria_breakdown: upper-case, keep the letters in VALUES.
function gematria(text) {
  const parts = []; let total = 0;
  for (const ch of text.toUpperCase()) {
    if (Object.prototype.hasOwnProperty.call(VALUES, ch)) { parts.push([ch, VALUES[ch]]); total += VALUES[ch]; }
  }
  return {parts, total};
}

// Python's repr() of one character, as it appears in the ValueError message.
function pyRepr(ch) {
  const c = ch.codePointAt(0);
  if (/[\p{Cc}\p{Cf}\p{Cs}\p{Co}\p{Cn}\p{Zl}\p{Zp}\p{Zs}]/u.test(ch)) {
    const h = c.toString(16);
    return "'" + (c <= 0xff ? "\\x" + h.padStart(2, "0") : c <= 0xffff ? "\\u" + h.padStart(4, "0") : "\\U" + h.padStart(8, "0")) + "'";
  }
  return "'" + ch + "'";
}

// ascii_name_sum.ascii_breakdown: every character 0..127, named if a control or a space.
function ascii(text) {
  const parts = []; let total = 0;
  for (const ch of text) {
    const code = ch.codePointAt(0);
    if (code > 127) return {error: `Non-ASCII character encountered: ${pyRepr(ch)}`};
    const shown = CONTROL[code] !== undefined ? CONTROL[code] : ch === " " ? "Space" : ch;
    parts.push([shown, code]); total += code;
  }
  return {parts, total};
}

// ---- ASCII-rizing -----------------------------------------------------------------

// Every character outside ASCII is replaced by its plain-ASCII form before either value is
// computed, so no name fails: first by the table below, else by Unicode compatibility
// decomposition with the accents removed (Ë → E, ﬁ → fi, Ａ → A); a character with no ASCII
// form at all (a zero-width space, a Chinese character) is dropped.
const ASCII_OF = (() => {
  const m = {
    "’": "'", "‘": "'", "‚": ",", "‛": "'", "′": "'", "“": '"', "”": '"', "„": '"', "″": '"', "«": '"', "»": '"',
    "‐": "-", "‑": "-", "‒": "-", "–": "-", "—": "-", "―": "-", "−": "-", "…": "...", "·": ".", "•": "*",
    "ß": "ss", "ẞ": "SS", "Æ": "AE", "æ": "ae", "Œ": "OE", "œ": "oe", "Ø": "O", "ø": "o", "Đ": "D", "đ": "d",
    "Ð": "D", "ð": "d", "Þ": "TH", "þ": "th", "Ł": "L", "ł": "l", "ı": "i", "Ħ": "H", "ħ": "h", "Ŋ": "NG",
    "ŋ": "ng", "ĸ": "k", "ſ": "s",
  };
  const cyr = {А:"A",Б:"B",В:"V",Г:"G",Д:"D",Е:"E",Ё:"YO",Ж:"ZH",З:"Z",И:"I",Й:"Y",К:"K",Л:"L",М:"M",Н:"N",
    О:"O",П:"P",Р:"R",С:"S",Т:"T",У:"U",Ф:"F",Х:"KH",Ц:"TS",Ч:"CH",Ш:"SH",Щ:"SHCH",Ъ:"",Ы:"Y",Ь:"",Э:"E",
    Ю:"YU",Я:"YA",Є:"YE",І:"I",Ї:"YI",Ґ:"G",Ђ:"DJ",Ј:"J",Љ:"LJ",Њ:"NJ",Ћ:"C",Џ:"DZ",Ў:"U"};
  const grk = {Α:"A",Β:"V",Γ:"G",Δ:"D",Ε:"E",Ζ:"Z",Η:"I",Θ:"TH",Ι:"I",Κ:"K",Λ:"L",Μ:"M",Ν:"N",Ξ:"X",Ο:"O",
    Π:"P",Ρ:"R",Σ:"S",Τ:"T",Υ:"Y",Φ:"F",Χ:"CH",Ψ:"PS",Ω:"O"};
  for (const t of [cyr, grk]) for (const [k, v] of Object.entries(t)) { m[k] = v; m[k.toLowerCase()] = v.toLowerCase(); }
  m["ς"] = "s";
  return m;
})();

function asciirize(text) {
  let out = "";
  for (const ch of text) {
    if (ch.codePointAt(0) < 128) { out += ch; continue; }
    if (ch in ASCII_OF) { out += ASCII_OF[ch]; continue; }
    for (const c of ch.normalize("NFKD")) {
      if (c.codePointAt(0) < 128) out += c;
      else if (c in ASCII_OF) out += ASCII_OF[c];
    }
  }
  return out;
}

// Python's str.strip() whitespace, which differs from JavaScript's trim() at the edges
// (\x1c-\x1f and \x85 are whitespace to Python; ﻿ is not).
const PYWS = "\t\n\x0b\x0c\r\x1c\x1d\x1e\x1f \x85\xa0  -     　";
const LEAD = new RegExp(`^[${PYWS}]+`), TRAIL = new RegExp(`[${PYWS}]+$`);
const strip = s => s.replace(LEAD, "").replace(TRAIL, "");
const kept = l => strip(l) !== "" && !l.replace(LEAD, "").startsWith("#");

// csv.writer's default dialect: minimal quoting, \r\n line ends.
const csvField = v => { v = String(v); return /[",\r\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
const csvRow = r => r.map(csvField).join(",") + "\r\n";

function stamp() {
  const d = new Date(), p = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}

// ---- lines in, rows out, at any size -----------------------------------------------

// The lines of a text or a file, a batch at a time. The programs open their file in
// text mode as UTF-8, so \r\n, \r and \n all end a line, a byte-order mark is kept as
// a character, and bytes that are not UTF-8 are an error. A file is never read whole.
async function* batches(src, progress) {
  if (typeof src === "string") { yield src.split(/\r\n|\r|\n/); return; }
  let read = 0;
  const counted = src.stream().pipeThrough(new TransformStream({
    transform(chunk, c) { read += chunk.byteLength; progress(read / src.size); c.enqueue(chunk); }
  }));
  const reader = counted.pipeThrough(new TextDecoderStream("utf-8", {fatal: true, ignoreBOM: true})).getReader();
  let rest = "";
  for (;;) {
    const {value, done} = await reader.read();
    if (done) break;
    let buf = rest + value;
    const cr = buf.endsWith("\r");                // may be the first half of a \r\n
    if (cr) buf = buf.slice(0, -1);
    const parts = buf.split(/\r\n|\r|\n/);
    rest = parts.pop() + (cr ? "\r" : "");
    yield parts;
  }
  yield rest.split(/\r\n|\r|\n/);
}

// Where the CSV goes. For a large file, where the browser allows it (Chrome, Edge),
// straight to a file on disk as it is made; otherwise into the browser's own storage,
// folded into one Blob every 16 MB so the page never holds the text itself, then saved.
const STREAM_ABOVE = 50e6;
async function sink(name, big) {
  if (big && window.showSaveFilePicker) {
    let handle;
    try {
      handle = await window.showSaveFilePicker({suggestedName: name, types: [{description: "CSV", accept: {"text/csv": [".csv"]}}]});
    } catch (e) {
      if (e.name === "AbortError") return null;
    }
    if (handle) {
      const w = await handle.createWritable();
      return {name: handle.name, write: t => w.write(t), close: () => w.close(), abort: () => w.close()};
    }
  }
  let blob = new Blob([]), parts = [], size = 0;
  return {
    name,
    write(t) { parts.push(t); size += t.length; if (size > 16e6) { blob = new Blob([blob, ...parts]); parts = []; size = 0; } },
    close() {
      blob = new Blob([blob, ...parts], {type: "text/csv;charset=utf-8"}); parts = [];
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 60000);
    },
    abort() { parts = []; blob = null; },
  };
}

const HEADER = ["original_name", "normalized_letters", "h-gematria_breakdown", "h-gematria_total",
                "ascii_characters", "ascii_breakdown", "ascii_total", "delta"];
const SHOWN = 200;
let running = null;

// One row per name: gematria_names.py's columns, then ascii_name_sum.py's, then the delta.
// The ASCII columns are taken from the line as written, as ascii_name_sum.py reads it.
async function run() {
  if (running) { running.stop = true; return; }
  const file = $("file").files[0] || null;
  const src = file || $("list").value;
  const out = await sink(`h-gematria_ascii_results_${stamp()}.csv`, !!file && file.size > STREAM_ABOVE);
  if (!out) return;
  running = {stop: false};
  $("run").textContent = "Stop";
  const shown = []; let n = 0, pct = "", ok = false;
  const status = () => term(shown.join("") + (n > SHOWN ? `… ${(n - SHOWN).toLocaleString()} more\n` : "") +
                           `\n${running && !ok ? "Running" : "Processed"} ${n.toLocaleString()} name(s)${pct}`);
  try {
    await out.write(csvRow(HEADER));
    for await (const batch of batches(src, f => { pct = ` · ${Math.floor(f * 100)}% of ${file.name} read`; })) {
      let csv = "";
      for (const line of batch) {
        if (!kept(line)) continue;
        const plain = asciirize(line), name = strip(line), g = gematria(strip(plain)), a = ascii(plain);
        const gcols = [name, g.parts.map(p => p[0]).join(""), g.parts.map(([l, v]) => `${l}=${v}`).join(" + "), g.total];
        let said;
        if (a.error) {
          csv += csvRow([...gcols, "", `ERROR: ${a.error}`, "", ""]);
          said = `${name} -> H-Gematria ${g.total} · ASCII ERROR: ${a.error}\n`;
        } else {
          const d = g.total - a.total;
          csv += csvRow([...gcols, a.parts.map(([s]) => s === "Space" ? " " : s).join(""),
                         a.parts.map(([s, v]) => `${s}=${v}`).join(" + "), a.total, d]);
          said = `${name} -> H-Gematria ${g.total} · ASCII ${a.total} · Delta ${d}\n`;
        }
        if (++n <= SHOWN) shown.push(said);
      }
      await out.write(csv);
      status();
      if (running.stop) break;
      await new Promise(r => setTimeout(r, 0));
    }
    if (!n) { out.abort(); return term(`No names found in: ${file ? file.name : "the list above"}`); }
    if (running.stop) {
      await out.close();
      return term(shown.join("") + `\nStopped after ${n.toLocaleString()} name(s).\nOutput written to: ${out.name} (partial)`);
    }
    await out.close(); ok = true;
    term(shown.join("") + (n > SHOWN ? `… ${(n - SHOWN).toLocaleString()} more\n` : "") +
         `\nProcessed ${n.toLocaleString()} name(s).\nOutput written to: ${out.name}`);
  } catch (e) {
    out.abort();
    term(e instanceof TypeError && /decod|encod|malformed|utf-?8/i.test(e.message)
      ? `${file ? file.name : "The list"} is not UTF-8 text, which the programs require.`
      : `Could not finish: ${e.message}`);
  } finally {
    running = null; $("run").textContent = "Run";
  }
}

function term(s) { const t = $("term"); t.hidden = false; t.textContent = s; }

function chosen() {
  const f = $("file").files[0];
  $("list").disabled = !!f;
  $("chosen").textContent = f ? `${f.name} · ${(f.size / 1e6).toLocaleString(undefined, {maximumFractionDigits: 1})} MB` : "";
  $("unchoose").hidden = !f;
}

// ---- any text -----------------------------------------------------------------

function chips(parts, ctl) {
  return '<div class="chips">' + parts.map(([s, v]) =>
    `<span class="chip${ctl && s.length > 1 ? " ctl" : ""}"><b>${esc(s === "Space" ? "␣" : s)}</b><i>${v}</i></span>`).join("") + "</div>";
}

function one() {
  const t = $("one").value;
  if (!t) { $("g1").innerHTML = $("a1").innerHTML = $("d1").innerHTML = ""; $("as1").hidden = true; return; }
  const plain = asciirize(t), g = gematria(plain), a = ascii(plain);
  $("as1").hidden = plain === t;
  $("as1").textContent = plain === t ? "" : `ASCII-rized as: ${plain}`;
  $("g1").innerHTML = `<div class="total">${g.total}</div>` +
    (g.parts.length ? chips(g.parts) : '<p class="note">No letters.</p>');
  $("a1").innerHTML = a.error ? `<div class="total err">ERROR</div><p class="err">${esc(a.error)}</p>`
    : `<div class="total">${a.total}</div>` + (a.parts.length ? chips(a.parts, true) : "");
  $("d1").innerHTML = a.error ? `<div class="total">—</div><p class="note">ASCII has no value for this text.</p>`
    : `<div class="total">${g.total - a.total}</div><p class="note mono">H-Gematria − ASCII = ${g.total} − ${a.total}</p>`;
}

// ---- load -------------------------------------------------------------------------

async function main() {
  const tables = await fetch("data/tables.json").then(r => r.json());
  VALUES = tables.values; CONTROL = tables.control_names;

  $("reset").onclick = () => {
    if (running) return;
    $("list").value = ""; $("file").value = ""; chosen(); $("term").hidden = true; $("list").focus();
  };
  $("file").addEventListener("change", chosen);
  $("unchoose").onclick = () => { $("file").value = ""; chosen(); };
  $("run").onclick = run;

  $("one").addEventListener("input", one);

  one();
}
main().catch(e => { $("g1").innerHTML = `<p class="err">Could not load: ${esc(e.message)}</p>`; });
</script>
</body>
</html>
